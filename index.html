<style>
:root{--bg:#fafaf9;--surface:#fff;--fg:#1c1917;--muted:#6b6560;--line:#e7e3df;--accent:#f26a1b;--accent-fg:#1a1208;--accent-soft:#fff0e5;--good:#1f7a46;--good-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fde8e6;--warn:#9a5b00;--warn-soft:#fff3d6;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#141210;--surface:#1e1b18;--fg:#f5f2ee;--muted:#a39c94;--line:#332e29;--accent:#ff7d33;--accent-soft:#2c1d12;--good:#5cc98a;--good-soft:#14281d;--bad:#ff8a80;--bad-soft:#3a1b18;--warn:#f0b955;--warn-soft:#2e2410}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
body.hasbar{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:inline-block}
.meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}.meta b{color:var(--fg)}.meta a{color:inherit;text-decoration:none}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.on{background:var(--good-soft);color:var(--good)}.status.off{background:var(--bad-soft);color:var(--bad)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;width:100%}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;padding:8px 14px;border-radius:8px;font-weight:500;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected=true]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.badge{background:var(--accent);color:var(--accent-fg);border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px}
.banner{background:linear-gradient(135deg,var(--accent),#ffa561);color:var(--accent-fg);margin-top:16px;border-radius:16px;padding:22px;box-shadow:0 10px 26px -14px rgba(242,106,27,.7)}
.banner h1{font-size:clamp(22px,5vw,32px);line-height:1.15;margin:0 0 8px;text-wrap:balance}.banner p{margin:0;max-width:44ch}
.promo{display:flex;gap:10px;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;white-space:pre-line;overflow-wrap:anywhere;font-weight:600}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.search{margin-top:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
h2.sec{font-size:18px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}h2.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
h2.page{font-size:22px;margin:20px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(0,0,0,.4)}.card.out{opacity:.6}
.pic{height:110px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:46px;margin-bottom:6px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}
.name{font-weight:600;overflow-wrap:anywhere}.unit,.note{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}.price{font-weight:700;font-variant-numeric:tabular-nums}
.add{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:7px 12px;font-weight:600}.add:disabled{background:var(--line);color:var(--muted);cursor:default}
.qty{display:inline-flex;align-items:center;background:var(--accent-soft);border-radius:8px}.qty button{background:none;border:0;width:32px;height:32px;font-size:18px}.qty span{min-width:20px;text-align:center;font-weight:600}
.empty{color:var(--muted);padding:24px 0}.empty.box{border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;margin-top:16px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.bar[hidden]{display:none}
.bar button{width:100%;max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px}.bar button:disabled{background:var(--line);color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h3{font-size:20px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}.x{background:none;border:0;font-size:28px;line-height:1;color:var(--muted)}
.line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.line .s{color:var(--muted);font-size:13px}
.sum{display:grid;gap:4px;padding:14px 0}.sum div{display:flex;justify-content:space-between}.sum .total{font-weight:700;font-size:17px}
.primary{width:100%;background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;margin-top:6px}.primary:disabled{background:var(--line);color:var(--muted)}
.ghost{width:100%;background:none;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}

.btn.danger{color:var(--bad)}.btn.danger.sure{background:var(--bad);border-color:var(--bad);color:#fff}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.pay{display:grid;gap:8px;margin-top:6px}.pay label{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}

.filters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Number(n)||0).toLocaleString("en-US").replace(/,/g,"'") + "₮";
const two = n => (n<10?"0":"")+n;
const when = ms => { const d = new Date(Number(ms)||0); return two(d.getMonth()+1)+"-"+two(d.getDate())+" "+two(d.getHours())+":"+two(d.getMinutes()); };
const lsGet = (k,d) => { try { const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); } catch(e){ return d; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

/* ---------- firebase ---------- */
let db = null, auth = null, fbOk = false;
try {
  if (typeof firebase !== "undefined" && FIREBASE_CONFIG.apiKey) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); auth = firebase.auth(); fbOk = true; }
} catch(e){ fbOk = false; }

/* ---------- state ---------- */
function tOk(x,d){ return /^\d{2}:\d{2}$/.test(String(x||"")) ? x : d; }
function qrOk(x){ return (typeof x==="string" && /^data:image\/(png|jpeg);base64,/.test(x)) ? x : ""; }
function parseSettings(v){
  v = v || {};
  const one = b => { b = b||{}; return {bank:String(b.bank||""), acct:String(b.acct||""), holder:String(b.holder||"")}; };
  return {fee:v.fee==null?3000:(Number(v.fee)||0), freeFrom:v.freeFrom==null?50000:(Number(v.freeFrom)||0),
    woowQr:qrOk(v.woowQr), monQr:qrOk(v.monQr), promo:String(v.promo||"").slice(0,400),
    banks:Array.isArray(v.banks)?v.banks.map(one).filter(b=>b.acct):[],
    mode:["auto","open","closed"].includes(v.mode)?v.mode:"auto", openT:tOk(v.openT,"08:00"), closeT:tOk(v.closeT,"23:00")};
}
let products = [], settings = parseSettings({}), productsLoaded = false, loadFailed = false;
let allOrders = [], myOrders = {}, myList = lsGet("mm_orders", []);
let cart = lsGet("mm_cart", {}), cat = "Бүгд", query = "", pay = "mon", view = "shop", ofilter = "active";
let editing = null, confirmDel = null, step = "cart", busy = false, imgData = "", editBanks = [];
let user = null, isAdmin = false, ordersUnsub = null;

const byId = id => products.find(p => p.id===id);
const stockOf = p => (typeof p.stock==="number" && isFinite(p.stock)) ? p.stock : null;
const soldOut = p => { const s = stockOf(p); return p.inStock===false || (s!==null && s<=0); };
const count = () => Object.values(cart).reduce((a,b)=>a+b,0);
const subtotal = () => Object.entries(cart).reduce((s,[k,v]) => s + (byId(k) ? (Number(byId(k).price)||0)*v : 0), 0);
const fee = () => { const s = subtotal(); return (s===0 || s>=settings.freeFrom) ? 0 : settings.fee; };
const cats = () => [...new Set(products.map(p => p.category||"Бусад"))];
const sorted = () => products.slice().sort((a,b) => String(a.name).localeCompare(String(b.name)));
const saveCart = () => lsSet("mm_cart", cart);

/* ---------- opening hours ---------- */
const mins = t => { const a = String(t).split(":"); return Number(a[0])*60 + Number(a[1]); };
function isOpen(){
  if (settings.mode==="open") return true; if (settings.mode==="closed") return false;
  const d = new Date(), n = d.getHours()*60+d.getMinutes(), o = mins(settings.openT), c = mins(settings.closeT);
  return o<=c ? (n>=o && n<c) : (n>=o || n<c);
}
const closedMsg = () => settings.mode==="closed" ? "Дэлгүүр түр хаалттай байна." : "Дэлгүүр одоо хаалттай байна. "+settings.openT+"-д нээнэ.";
function renderHours(){
  const o = isOpen(), t = settings.openT+"–"+settings.closeT;
  $("#hrs").textContent = t; const b = $("#hrsTxt"); if (b) b.textContent = t;
  const why = settings.mode==="closed" ? "Түр хаасан" : (o ? (settings.mode==="open" ? "Захиалга авч байна" : settings.closeT+" хүртэл") : settings.openT+"-д нээнэ");
  $("#stat").innerHTML = '<span class="status '+(o?"on":"off")+'">'+(o?"Нээлттэй":"Хаалттай")+" · "+why+"</span>";
  const pb = $("#promoBox"); if (pb) pb.innerHTML = settings.promo ? '<div class="promo"><span aria-hidden="true">📢</span><div>'+esc(settings.promo)+"</div></div>" : "";
  const cn = $("#closedNote"); if (cn) cn.innerHTML = o ? "" : '<p class="warnbox">'+closedMsg()+" Бараа үзэж, сагслах боломжтой. Захиалгыг нээлттэй үед өгнө.</p>";
  const ft = $("#freeTxt"); if (ft) ft.textContent = fmt(settings.freeFrom)+"-с дээш захиалгад хүргэлт үнэгүй.";
}

/* ---------- shell ---------- */
function renderTabs(){
  const t = [["shop","Дэлгүүр"],["my","Миний захиалга"]];
  if (isAdmin) t.push(["orders","Захиалгууд"],["manage","Бараа"],["settings","Тохиргоо"],["share","Хуваалцах"],["logout","Гарах"]);
  const newN = allOrders.filter(o=>o.status==="new").length;
  $("#tabs").innerHTML = t.map(x => '<button class="tab" role="tab" data-view="'+x[0]+'" aria-selected="'+(view===x[0])+'">'+x[1]+((x[0]==="orders"&&newN)?'<span class="badge">'+newN+"</span>":"")+"</button>").join("");
  renderHours();
}
function renderMain(){
  if (!isAdmin && ["orders","manage","settings","share"].includes(view)) view = "shop";
  renderTabs();
  const sb = view==="shop"; $("#bar").hidden = !sb; document.body.classList.toggle("hasbar", sb);
  ({shop:shopView,my:myView,orders:ordersView,manage:manageView,settings:settingsView,share:shareView}[view] || shopView)();
  renderBar();
}
function renderBody(){
  if (view==="shop") shopList(); else if (view==="my") myView(); else if (view==="orders") ordersView(); else if (view==="manage") manageList();
  renderTabs(); renderBar();
}

    '<div class="search"><input class="in" id="q" type="search" placeholder="Бараа хайх" aria-label="Бараа хайх" value="'+esc(query)+'"></div><div class="chips" id="chips"></div><div id="list"></div>' +

function ctrl(p){
  if (soldOut(p)) return '<button class="add" disabled>Дууссан</button>';
  const q = cart[p.id]||0;
  if (!q) return '<button class="add" data-add="'+esc(p.id)+'">Нэмэх</button>';
  return '<div class="qty"><button data-dec="'+esc(p.id)+'" aria-label="Хасах">−</button><span>'+q+'</span><button data-inc="'+esc(p.id)+'" aria-label="Нэмэх">+</button></div>';
}
const picHtml = (p,small) => p.img ? '<img src="'+esc(p.img)+'" alt="" loading="lazy">' : esc(p.emoji||"🛒");
function shopList(){
  renderHours();
  const cs = ["Бүгд", ...cats()]; if (!cs.includes(cat)) cat = "Бүгд";
  const ch = $("#chips"); if (ch) ch.innerHTML = cs.map(c => '<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+"</button>").join("");

  if (!fbOk) { el.innerHTML = '<div class="empty box">Дэлгүүрийн өгөгдлийн сан холбогдоогүй байна (үзүүлэх горим). README-г үзнэ үү.</div>'; }

  if (!products.length){ el.innerHTML = '<div class="empty box">'+(isAdmin?"Одоогоор бараа алга. «Бараа» цэс рүү орж эхний барааг нэмнэ үү.":"Удахгүй бараа нэмэгдэнэ.")+"</div>"; return; }

function renderBar(){
  const n = count(), b = $("#open"); b.disabled = !n;
  $("#barN").textContent = n ? "Сагс · "+n+" бараа" : "Сагс хоосон"; $("#barT").textContent = n ? fmt(subtotal()) : "";
}
function change(id,d){
  const p = byId(id); if (!p) return;
  let v = Math.max(0,(cart[id]||0)+d), s = stockOf(p); if (s!==null) v = Math.min(v,s);
  v ? cart[id] = v : delete cart[id]; saveCart(); shopList(); renderBar();
  if (!$("#sheet").hidden && step==="cart") showCart();
}

function showDone(no,total){
  step = "done";
  $("#panel").innerHTML = head("")+'<div class="ok"><div class="tick">✓</div><h3 style="justify-content:center">Захиалга хүлээн авлаа</h3><p>Захиалгын дугаар: <b>'+esc(no)+'</b></p><p><b>Нийт: '+fmt(total)+'</b></p><p class="note">Захиалгын явцыг «Миний захиалга» цэснээс харна уу.</p></div><button class="primary" data-finish>Миний захиалга руу очих</button>';
}
async function placeOrder(){
  const err = $("#err"), nm = $("#nm").value.trim(), ph = $("#ph").value.trim(), ad = $("#ad").value.trim(), cm = $("#cm").value.trim();
  if (!isOpen()){ err.textContent = closedMsg(); return; }
  if (!nm || !ph || !ad){ err.textContent = "Нэр, утас, хаягаа бөглөнө үү."; return; }
  if (!fbOk){ err.textContent = "Захиалгын систем холбогдоогүй байна. Дэлгүүрийн "+SHOP_PHONE+" дугаарт залгана уу."; return; }
  if (busy) return; busy = true; $("#submitBtn").disabled = true;
  const items = Object.keys(cart).map(k => { const p = byId(k); return p ? {id:p.id,name:p.name,unit:p.unit||"",price:Number(p.price)||0,qty:cart[k]} : null; }).filter(Boolean);
  const sub = subtotal(), f = fee(), no = "MM-"+Date.now().toString(36).toUpperCase().slice(-6);
  const order = {no, items, subtotal:sub, fee:f, total:sub+f, name:nm, phone:ph, address:ad, comment:cm, pay, status:"new", createdAt:Date.now()};
  try {
    const ref = db.collection("orders").doc(); await ref.set(order);
    myList.unshift({id:ref.id,no}); myList = myList.slice(0,10); lsSet("mm_orders", myList); watchMy(ref.id);
    cart = {}; saveCart(); shopList(); renderBar(); showDone(no, order.total);
  } catch(e){ err.textContent = "Захиалга илгээж чадсангүй. Дахин оролдоно уу."; $("#submitBtn").disabled = false; }
  busy = false;
}

/* ---------- orders ---------- */
function orderCard(o, admin){
  const it = (o.items||[]).map(i => "<li>"+esc(i.name)+" × "+(Number(i.qty)||0)+" · "+fmt((Number(i.price)||0)*(Number(i.qty)||0))+"</li>").join("");
  const st = STATUS[o.status] ? o.status : "new", pm = PAY.find(m => m.id===o.pay);
  let h = '<div class="order"><div class="oh"><span class="no">'+esc(o.no||o.id)+'</span><span class="pill '+st+'">'+STATUS[st]+'</span></div><div class="note">'+when(o.createdAt)+" · "+esc(pm?pm.n:"")+"</div>";
  if (admin) h += '<div class="who"><b>'+esc(o.name)+"</b> · "+esc(o.phone)+"<br>"+esc(o.address)+(o.comment?'<br><span class="note">Тайлбар: '+esc(o.comment)+"</span>":"")+"</div>";
  h += "<ul>"+it+'</ul><div class="tot"><span>Хүргэлт: '+(Number(o.fee)?fmt(o.fee):"Үнэгүй")+"</span><span>Нийт "+fmt(o.total)+"</span></div>";
  if (admin){
    let a = "";
    if (NEXT[st]) a += '<button class="btn main" data-st="'+NEXT[st][0]+'" data-oid="'+esc(o.id)+'">'+NEXT[st][1]+"</button>";
    if (st!=="done" && st!=="cancelled") a += '<button class="btn danger" data-st="cancelled" data-oid="'+esc(o.id)+'">Цуцлах</button>';
    if (a) h += '<div class="act">'+a+"</div>";
  }
  return h+"</div>";
}
function myView(){
  const list = myList.map(m => myOrders[m.id]).filter(Boolean).sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
  $("#main").innerHTML = '<h2 class="page">Миний захиалга</h2>'+(list.length ? '<div class="orders">'+list.map(o => orderCard(o,false)).join("")+"</div>" : '<div class="empty box">Та одоогоор захиалга өгөөгүй байна.</div>')+'<p class="note" style="margin-top:12px">Захиалгын түүх зөвхөн энэ төхөөрөмж дээр хадгалагдана.</p>';
}
function watchMy(id){
  if (!fbOk) return;
  db.collection("orders").doc(id).onSnapshot(s => { if (s.exists) myOrders[id] = Object.assign({}, s.data(), {id}); else delete myOrders[id]; if (view==="my") myView(); }, () => {});
}
function ordersView(){
  const act = o => ["new","confirmed","delivering"].includes(o.status);
  const list = allOrders.filter(o => ofilter==="all" || (ofilter==="active" ? act(o) : !act(o))).sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
  const F = [["active","Идэвхтэй"],["closed","Дууссан"],["all","Бүгд"]];
  $("#main").innerHTML = '<h2 class="page">Захиалгууд</h2><p class="note">Шинэ захиалга ирэхэд энд автоматаар харагдана. Захиалгыг баталгаажуулахад барааны үлдэгдэл автоматаар хасагдана.</p><div class="filters">'+F.map(f => '<button class="chip" data-of="'+f[0]+'" aria-pressed="'+(ofilter===f[0])+'">'+f[1]+"</button>").join("")+"</div>"+
    (list.length ? '<div class="orders">'+list.map(o => orderCard(o,true)).join("")+"</div>" : '<div class="empty box">'+(allOrders.length?"Энэ ангилалд захиалга алга.":"Захиалга хараахан ирээгүй байна.")+"</div>");
}
const stBusy = {};
async function setStatus(oid, st){
  if (stBusy[oid] || !fbOk) return; stBusy[oid] = true;
  try {
    const ord = allOrders.find(x => x.id===oid), batch = db.batch();
    batch.update(db.collection("orders").doc(oid), {status:st, statusAt:Date.now()});
    if (ord){
      const was = ord.status; let dir = 0;
      if (was==="new" && st==="confirmed") dir = -1;
      else if ((was==="confirmed"||was==="delivering") && st==="cancelled") dir = 1;
      if (dir) (ord.items||[]).forEach(i => { const p = byId(i.id); if (p && stockOf(p)!==null) batch.update(db.collection("products").doc(p.id), {stock:firebase.firestore.FieldValue.increment(dir*(Number(i.qty)||0))}); });
    }
    await batch.commit();
  } catch(e){ alert("Төлөв өөрчилж чадсангүй. Дахин оролдоно уу."); }
  delete stBusy[oid];
}
function startOrders(){
  if (ordersUnsub || !fbOk) return;
  ordersUnsub = db.collection("orders").orderBy("createdAt","desc").limit(300).onSnapshot(snap => { allOrders = snap.docs.map(d => Object.assign({}, d.data(), {id:d.id})); renderBody(); }, () => {});
}
function stopOrders(){ if (ordersUnsub){ ordersUnsub(); ordersUnsub = null; } allOrders = []; }

  const el = $("#mlist"); if (!el) return;
  if (!productsLoaded){ el.innerHTML = '<p class="empty">Ачаалж байна…</p>'; return; }
  if (!products.length){ el.innerHTML = '<div class="empty box">Бараа алга байна. «Бараа нэмэх» товчоор эхний барааг оруулна уу.<br><br><button class="btn" data-seed>Анхны өгөгдөл (3 бараа, тохиргоо) оруулах</button></div>'; return; }
  el.innerHTML = '<div style="margin-top:12px">'+sorted().map(p => { const del = confirmDel===p.id;
    return '<div class="mrow"><div class="e">'+picHtml(p,true)+'</div><div style="min-width:0"><div class="nm">'+esc(p.name)+'</div><div class="sub">'+esc(p.category||"Бусад")+" · "+esc(p.unit)+" · "+fmt(p.price)+" · Үлдэгдэл: <b>"+(stockOf(p)===null?"тооллогогүй":stockOf(p))+"</b>"+(soldOut(p)?" · <b>Дууссан</b>":"")+'</div></div><div class="acts"><button class="btn" data-edit="'+esc(p.id)+'">Засах</button><button class="btn danger'+(del?" sure":"")+'" data-del="'+esc(p.id)+'">'+(del?"Устгахыг баталгаажуулах":"Устгах")+"</button></div></div>"; }).join("")+"</div>";
}
function shrink(file, max, q){
  return new Promise((res,rej) => {
    const im = new Image();
    im.onload = () => { const k = Math.min(1, max/Math.max(im.width,im.height)), c = document.createElement("canvas"); c.width = Math.max(1,Math.round(im.width*k)); c.height = Math.max(1,Math.round(im.height*k)); const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c); };
    im.onerror = () => rej(new Error("img"));
    const fr = new FileReader(); fr.onload = () => { im.src = fr.result; }; fr.onerror = () => rej(new Error("read")); fr.readAsDataURL(file);
  });
}
async function uploadImage(file){
  if (!file) return; const msg = $("#imsg"); msg.textContent = "Зураг боловсруулж байна…";
  try { let c = await shrink(file,640), d = c.toDataURL("image/jpeg",0.8); if (d.length>400000){ c = await shrink(file,420); d = c.toDataURL("image/jpeg",0.7); }
    imgData = d; $("#imgbox").innerHTML = imgInner(); }
  catch(e){ msg.textContent = "Зураг оруулж чадсангүй. Өөр зураг сонгоно уу."; }
}
async function saveProduct(){
  const name = $("#pn").value.trim(), price = Number($("#pp").value.replace(/[^\d.]/g,"")), err = $("#perr");
  if (!name || !price){ err.textContent = "Барааны нэр болон үнийг бөглөнө үү."; return; }
  const sv = ($("#ps").value||"").trim(), stock = sv==="" ? null : Math.max(0,Math.floor(Number(sv.replace(/[^\d.]/g,""))||0));
  const data = {name, unit:$("#pu").value.trim(), price, category:$("#pc").value.trim()||"Бусад", emoji:$("#pe").value.trim()||"🛒", img:imgData||"", stock, inStock:(stock===null||stock>0)};
  try { const ref = editing==="new" ? db.collection("products").doc() : db.collection("products").doc(editing); await ref.set(data); editing = null; imgData = ""; $("#mform").innerHTML = ""; }
  catch(e){ err.textContent = "Хадгалж чадсангүй. Дахин оролдоно уу."; }
}
async function seedData(){
  try { const b = db.batch(); SEED.products.forEach(p => { const {id,...rest} = p; b.set(db.collection("products").doc(id), Object.assign({inStock:true}, rest)); }); b.set(db.doc("settings/store"), SEED.settings, {merge:true}); await b.commit(); } catch(e){ alert("Оруулж чадсангүй."); }
}

/* ---------- admin: settings ---------- */
function settingsView(){ $("#main").innerHTML = '<h2 class="page">Дэлгүүрийн тохиргоо</h2><p class="note">Хүргэлт, ажлын цаг, данс, QR кодуудыг эндээс оруулна.</p><div id="mset"></div>'; settingsForm(); }
function bankRows(){
  return editBanks.map((b,i) => '<div class="formbox" style="margin-top:10px"><div class="fgrid"><div><label class="f">Банкны нэр</label><input class="in bk" data-i="'+i+'" data-k="bank" value="'+esc(b.bank)+'"></div><div><label class="f">Дансны дугаар</label><input class="in bk" data-i="'+i+'" data-k="acct" inputmode="numeric" value="'+esc(b.acct)+'"></div><div><label class="f">Данс эзэмшигч</label><input class="in bk" data-i="'+i+'" data-k="holder" value="'+esc(b.holder)+'"></div></div><button type="button" class="btn danger" style="margin-top:10px" data-bkdel="'+i+'">Энэ дансыг устгах</button></div>').join("") || '<p class="note">Данс нэмээгүй байна.</p>';
}
const syncBanks = () => document.querySelectorAll(".bk").forEach(el => { const b = editBanks[Number(el.dataset.i)]; if (b) b[el.dataset.k] = el.value; });
const bankBox = () => { const el = $("#bankbox"); if (el) el.innerHTML = bankRows(); };
function qrCard(key,name){
  const src = settings[key];
  return '<div class="formbox"><b>'+name+' QR</b><div class="imgrow">'+(src?'<img src="'+esc(src)+'" alt="'+name+' QR" style="width:110px;height:110px;background:#fff;object-fit:contain">':'<div class="noimg">QR алга</div>')+'<div><label class="btn main" style="display:inline-block;cursor:pointer">'+(src?"QR солих":"QR оруулах")+'<input type="file" accept="image/*" data-qrkey="'+key+'" hidden></label>'+(src?' <button type="button" class="btn danger" data-qrdel="'+key+'">Устгах</button>':"")+"</div></div></div>";
}
const qrBox = () => { const el = $("#qrbox"); if (el) el.innerHTML = '<p class="note" id="qmsg" role="status"></p>'+qrCard("monQr","MonPay")+qrCard("woowQr","Woow Pay"); };
function settingsForm(){
  const el = $("#mset"); if (!el) return;
  editBanks = settings.banks.map(b => Object.assign({}, b));
  el.innerHTML = '<h2 class="sec">Хүргэлт</h2><form class="formbox" id="sf" novalidate><div class="fgrid"><div><label class="f" for="sfee">Хүргэлтийн үнэ (₮)</label><input class="in" id="sfee" inputmode="numeric" value="'+esc(settings.fee)+'"></div><div><label class="f" for="sfree">Үнэгүй хүргэлтийн доод дүн (₮)</label><input class="in" id="sfree" inputmode="numeric" value="'+esc(settings.freeFrom)+'"></div></div>'+
    '<h2 class="sec">Сурталчилгаа</h2><label class="f" for="spromo">Худалдан авагчдад харагдах сурталчилгаа, мэдэгдэл</label><textarea class="in" id="spromo" rows="3" maxlength="400">'+esc(settings.promo)+'</textarea><p class="note">Хоосон үлдээвэл харагдахгүй.</p>'+
    '<h2 class="sec">Ажлын цаг</h2><div class="fgrid"><div><label class="f" for="smode">Горим</label><select class="in" id="smode"><option value="auto">Цагаар автоматаар нээж хаах</option><option value="open">Үргэлж нээлттэй</option><option value="closed">Түр хаасан</option></select></div><div><label class="f" for="sopen">Нээх цаг</label><input class="in" type="time" id="sopen" value="'+esc(settings.openT)+'"></div><div><label class="f" for="sclose">Хаах цаг</label><input class="in" type="time" id="sclose" value="'+esc(settings.closeT)+'"></div></div>'+
    '<h2 class="sec">Банкны данснууд</h2><div id="bankbox">'+bankRows()+'</div><button type="button" class="btn" style="margin-top:10px" data-bkadd>+ Данс нэмэх</button><p class="note" id="serr" role="status"></p><button class="btn main" type="submit">Хадгалах</button></form><h2 class="sec">QR кодууд</h2><div id="qrbox"></div>';
  $("#smode").value = settings.mode; qrBox();
}
async function saveSettings(){
  syncBanks();
  const num = id => Number($(id).value.replace(/[^\d.]/g,""))||0;
  const banks = editBanks.map(b => ({bank:b.bank.trim(),acct:b.acct.trim(),holder:b.holder.trim()})).filter(b => b.acct);
  try { await db.doc("settings/store").set({fee:num("#sfee"),freeFrom:num("#sfree"),promo:$("#spromo").value.trim().slice(0,400),mode:$("#smode").value,openT:$("#sopen").value||"08:00",closeT:$("#sclose").value||"23:00",banks}, {merge:true}); editBanks = banks.map(b => Object.assign({},b)); bankBox(); $("#serr").textContent = "Хадгалагдлаа."; }
  catch(e){ $("#serr").textContent = "Хадгалж чадсангүй."; }
}
async function uploadQr(key,file){
  if (!file) return; const m = $("#qmsg"); m.textContent = "Оруулж байна…";
  try { const c = await shrink(file,520); let d = c.toDataURL("image/png"); if (d.length>180000) d = c.toDataURL("image/jpeg",0.9); if (d.length>250000) throw 0;
    await db.doc("settings/store").set({[key]:d},{merge:true}); settings[key] = d; qrBox(); $("#qmsg").textContent = "QR хадгалагдлаа."; }
  catch(e){ m.textContent = "QR оруулж чадсангүй. QR кодыг тайрсан жижиг зураг сонгоно уу."; }
}
async function delQr(key){ try { await db.doc("settings/store").set({[key]:""},{merge:true}); settings[key] = ""; qrBox(); } catch(e){} }

/* ---------- admin: share ---------- */
function shareView(){
  const url = location.origin && location.origin!=="null" ? location.origin+location.pathname : location.href.split("#")[0];
  let qrImg = "";
  try { const q = qrcode(0,"M"); q.addData(url); q.make(); qrImg = '<img src="'+q.createDataURL(8,4)+'" alt="Холбоосын QR код" style="width:240px;max-width:100%;background:#fff;border-radius:8px;image-rendering:pixelated"><p class="note">QR кодыг удаан дарж хадгалаад хэвлэж, илгээж болно.</p>'; }
  catch(e){ qrImg = '<p class="note">QR код үүсгэх сан ачаалагдсангүй. Интернэт холболтоо шалгана уу.</p>'; }
  $("#main").innerHTML = '<h2 class="page">Хуваалцах</h2><p class="note">Энэ холбоос эсвэл QR кодыг хэрэглэгчдэд илгээнэ. Нэвтрэх шаардлагагүй.</p><div class="formbox"><label class="f" for="shl">Холбоос</label><input class="in" id="shl" readonly value="'+esc(url)+'"><div style="margin-top:10px"><button class="btn main" data-copy>Холбоос хуулах</button> <span class="note" id="cmsg" role="status"></span></div></div><div class="formbox" style="text-align:center">'+qrImg+"</div>";
}
function copyLink(){
  const i = $("#shl"), ok = () => { $("#cmsg").textContent = "Хуулагдлаа."; };
  try { navigator.clipboard.writeText(i.value).then(ok, () => { i.select(); document.execCommand("copy"); ok(); }); } catch(e){ i.select(); try { document.execCommand("copy"); ok(); } catch(_){} }
}

/* ---------- admin: login ---------- */
function showLogin(){
  step = "login";
  if (!fbOk){ $("#panel").innerHTML = head("Админ нэвтрэх")+'<p class="warnbox">Өгөгдлийн сан (Firebase) холбогдоогүй байна. README-ийн дагуу тохиргоогоо хийнэ үү.</p>'; openSheet(); return; }
  $("#panel").innerHTML = head("Админ нэвтрэх")+'<form id="lf" novalidate><label class="f" for="lu">Нэвтрэх нэр (и-мэйл)</label><input class="in" id="lu" type="email" autocomplete="username"><label class="f" for="lp">Нууц үг</label><input class="in" id="lp" type="password" autocomplete="current-password"><p class="note" id="lerr" role="alert" style="color:var(--bad)"></p><button class="primary" type="submit">Нэвтрэх</button></form>';
  openSheet();
}
async function submitLogin(){
  const u = $("#lu").value.trim(), pw = $("#lp").value, err = $("#lerr");
  if (!u || !pw){ err.textContent = "Нэр болон нууц үгээ бичнэ үү."; return; }
  lsSet("mm_login", Date.now());
  try { await auth.signInWithEmailAndPassword(u, pw); closeSheet(); view = "orders"; }
  catch(e){ try { localStorage.removeItem("mm_login"); } catch(_){} err.textContent = "Нэвтрэх нэр эсвэл нууц үг буруу байна."; }
}
function applyAuth(){
  const t = Number(lsGet("mm_login",0));
  if (user && (!t || Date.now()-t > SESSION_MS)){ auth.signOut(); return; }
  isAdmin = !!user && !!ADMIN_EMAIL && String(user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase();
  isAdmin ? startOrders() : stopOrders();
  if (!isAdmin && editing) editing = null;
  renderMain();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t){ if (e.target.id==="sheet") closeSheet(); return; }
  const d = t.dataset;
  if (d.view==="logout"){ if (auth) auth.signOut(); try { localStorage.removeItem("mm_login"); } catch(_){} view = "shop"; }
  else if ("login" in d) showLogin();
  else if (d.view){ view = d.view; editing = null; confirmDel = null; renderMain(); }
  else if (d.cat){ cat = d.cat; shopList(); }
  else if (d.add || d.inc) change(d.add||d.inc, 1);
  else if (d.dec) change(d.dec, -1);
  else if (t.id==="open") showCart();
  else if ("close" in d) closeSheet();
  else if ("next" in d) showCheckout();
  else if ("back" in d) showCart();
  else if ("finish" in d){ closeSheet(); view = "my"; renderMain(); }
  else if (d.of){ ofilter = d.of; ordersView(); }
  else if (d.st) setStatus(d.oid, d.st);
  else if ("new" in d){ editing = "new"; imgData = ""; productForm(); }
  else if (d.edit){ editing = d.edit; imgData = (byId(d.edit)||{}).img || ""; productForm(); }
  else if ("rmimg" in d){ imgData = ""; $("#imgbox").innerHTML = imgInner(); }
  else if ("cancel" in d){ editing = null; $("#mform").innerHTML = ""; }
  else if (d.pickcat){ $("#pc").value = d.pickcat; }
  else if ("bkadd" in d){ syncBanks(); editBanks.push({bank:"",acct:"",holder:""}); bankBox(); }
  else if (d.bkdel !== undefined){ syncBanks(); editBanks.splice(Number(d.bkdel),1); bankBox(); }
  else if (d.qrdel) delQr(d.qrdel);
  else if ("copy" in d) copyLink();
  else if ("seed" in d) seedData();
  else if (d.del){ if (confirmDel===d.del){ confirmDel = null; db.collection("products").doc(d.del).delete().catch(()=>{}); } else { confirmDel = d.del; manageList(); } }
});
document.addEventListener("change", e => {
  if (e.target.name==="pay"){ pay = e.target.value; payInfo(); }
  else if (e.target.id==="pimg") uploadImage(e.target.files && e.target.files[0]);
  else if (e.target.dataset && e.target.dataset.qrkey){ uploadQr(e.target.dataset.qrkey, e.target.files && e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id==="f") placeOrder(); else if (e.target.id==="pf") saveProduct(); else if (e.target.id==="sf") saveSettings(); else if (e.target.id==="lf") submitLogin();
});

/* ---------- boot ---------- */
for (const k of Object.keys(cart)) if (!(cart[k] > 0)) delete cart[k];
if (!fbOk){
  products = SEED.products.map(p => Object.assign({inStock:true}, p)); settings = parseSettings(SEED.settings); productsLoaded = true;
  renderMain();
} else {
  renderMain();
  const timer = setTimeout(() => { if (!productsLoaded){ loadFailed = true; renderBody(); } }, 10000);
  db.collection("products").onSnapshot(snap => {
    clearTimeout(timer); loadFailed = false; productsLoaded = true;
    products = snap.docs.map(d => Object.assign({}, d.data(), {id:d.id}));
    for (const k of Object.keys(cart)){ const p = byId(k); if (!p || soldOut(p)) delete cart[k]; else if (stockOf(p)!==null) cart[k] = Math.min(cart[k], stockOf(p)); }
    saveCart(); renderBody();
  }, () => { clearTimeout(timer); loadFailed = true; renderBody(); });
  db.doc("settings/store").onSnapshot(s => { settings = parseSettings(s.exists ? s.data() : {}); renderHours(); if (view==="shop") shopList(); renderBar(); }, () => {});
  myList.forEach(m => watchMy(m.id));
  auth.onAuthStateChanged(u => { user = u; applyAuth(); });
  setInterval(() => { if (user && Date.now()-Number(lsGet("mm_login",0)) > SESSION_MS) auth.signOut(); }, 60000);
}
setInterval(renderHours, 30000);
</script>
